plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.xermux.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.xermux.app"
        minSdk 26 // x11 needs 26+, no point going lower
        targetSdk 34
        versionCode 3
        versionName "1.0.2"

        vectorDrawables { useSupportLibrary true }
        resourceConfigurations += ["en"] // keep apk smaller, add langs later if needed
    }

    // signing: CI drops a real key at release.keystore when the secrets are set.
    // otherwise we borrow the debug key so the apk still installs — an unsigned
    // release apk just says "package appears invalid" on install, ran into that.
    def releaseKeyFile = rootProject.file("release.keystore")
    def hasRealKey = releaseKeyFile.exists()

    signingConfigs {
        release {
            if (hasRealKey) {
                storeFile releaseKeyFile
                storePassword System.getenv("XERMUX_KEYSTORE_PASSWORD") ?: "xermux123"
                keyAlias System.getenv("XERMUX_KEY_ALIAS") ?: "xermux"
                keyPassword System.getenv("XERMUX_KEY_PASSWORD") ?: "xermux123"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasRealKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // left splits off for now, one universal apk is easier to share around.
    // if this gets fat I'll turn per-abi splits back on.
    splits {
        abi {
            enable false
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }

    packaging {
        jniLibs { useLegacyPackaging true } // termux .so files want this
    }

    lint { abortOnError false }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.3"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.3"
    implementation "androidx.fragment:fragment-ktx:1.8.1"
    implementation "androidx.preference:preference-ktx:1.2.1"

    // real termux terminal libs, same ones termux-app publishes (0.118.0 on jitpack)
    implementation "com.termux.termux-app:terminal-emulator:0.118.0"
    implementation "com.termux.termux-app:terminal-view:0.118.0"
    implementation "com.termux.termux-app:termux-shared:0.118.0"
    // termux wiki says to add this, otherwise duplicate ListenableFuture class error
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
}
