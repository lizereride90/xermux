plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.xermux.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.xermux.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        vectorDrawables { useSupportLibrary true }
        resourceConfigurations += ["en"]
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // OPTIMISATION: universal APK by default, ABI split ready for size tuning.
    // F-Droid style: keep universalApk true so a single artifact works everywhere.
    splits {
        abi {
            enable false
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }

    lint { abortOnError false }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.3"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.3"
    implementation "androidx.fragment:fragment-ktx:1.8.1"
    implementation "androidx.preference:preference-ktx:1.2.1"

    // Inbuilt Termux terminal (official libs via JitPack, same as termux-app 0.118.0)
    implementation "com.termux.termux-app:terminal-emulator:0.118.0"
    implementation "com.termux.termux-app:terminal-view:0.118.0"
    implementation "com.termux.termux-app:termux-shared:0.118.0"
    // Avoid Duplicate class ListenableFuture from Guava (required by Termux wiki)
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
}
