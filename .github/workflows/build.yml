name: Build Xermux APK

# just builds the apk so I don't have to mess with Android Studio every time
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # runners already ship the sdk, no need for the setup-android action
      # (that one broke asking for the old "tools" package).
      # sdkmanager isn't on PATH by default so I point at it directly.
      - name: Install platform + build-tools
        run: |
          echo "sdk is at $ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
          gradle --version

      # real key when the repo secrets exist, debug signing otherwise.
      # either way the apk comes out signed + installable.
      - name: Restore release keystore
        env:
          KEY_B64: ${{ secrets.XERMUX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > release.keystore
            echo "real key restored"
          else
            echo "no key secret set, release will borrow debug signing"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xermux-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release APK
        env:
          XERMUX_KEYSTORE_PASSWORD: ${{ secrets.XERMUX_KEYSTORE_PASSWORD }}
          XERMUX_KEY_ALIAS: ${{ secrets.XERMUX_KEY_ALIAS }}
          XERMUX_KEY_PASSWORD: ${{ secrets.XERMUX_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      # sanity check the signature so a broken/unsigned apk never ships quietly
      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: xermux-release-apk
          path: app/build/outputs/apk/release/*.apk
