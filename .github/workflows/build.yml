name: Build xermux

# one apk: real Termux UI + embedded X11, bootstraps download at build time,
# X server compiles from source here, so this takes a while. grab coffee.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TERMUX_PACKAGE_VARIANT: apt-android-7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install SDK packages (platform, build-tools, NDK, CMake)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-34" \
            "build-tools;36.0.0" "build-tools;34.0.0" \
            "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Build debug APKs (Termux + X11, bootstrap included)
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify signatures
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/*universal*.apk || \
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/*universal*.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: xermux-universal-apk
          path: |
            app/build/outputs/apk/debug/*universal*.apk
            app/build/outputs/apk/debug/output-metadata.json

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: xermux-arm64-apk
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
